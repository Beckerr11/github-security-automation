name: Nightly Security Audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    env:
      GITHUB_TOKEN: ${{ secrets.GH_AUDIT_TOKEN || github.token }}
      AUDIT_OWNER: ${{ vars.AUDIT_OWNER || github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run security audit
        run: python src/audit.py --owner "$AUDIT_OWNER" --output-prefix security-report

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            security-report.json
            security-report.md
            security-report.csv
